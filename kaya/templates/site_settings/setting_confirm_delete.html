{% extends 'base.html' %}

{% block content %}
<div class="container my-4" style="max-width: 500px;">
    <div class="card border-danger shadow-sm">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Delete Setting</h4>
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete <strong>"{{ setting.site_title }}"</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <a href="{% url 'setting_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger">Confirm Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
