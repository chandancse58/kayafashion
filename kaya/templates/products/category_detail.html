<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ category.meta_title }}</title>
    <meta name="description" content="{{ category.meta_description }}">
    <meta name="keywords" content="{{ category.meta_keywords }}">
</head>
<body>
    {% if category.cover_image %}
        <img src="{{ category.cover_image.url }}" alt="{{ category.name }} Cover" style="width:100%; height:auto;">
    {% endif %}

    <h1>{{ category.title }}</h1>
    
    <div>
        <img src="{{ category.thumbnail_image.url }}" alt="{{ category.name }} Thumbnail" width="150">
        <p>{{ category.description }}</p>
    </div>
</body>
</html>
