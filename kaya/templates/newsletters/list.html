<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Newsletters</h2>
        <a href="{% url 'newsletter_create' %}" class="btn btn-success">+ Add Newsletter</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Date & Time</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in newsletters %}
            <tr>
                <td>{{ item.title }}</td>
                <td><span class="badge bg-info">{{ item.get_status_display }}</span></td>
                <td>{{ item.datetime|date:"M d, Y H:i" }}</td>
                <td>
                    <a href="{% url 'newsletter_detail' item.pk %}" class="btn btn-sm btn-info">View</a>
                    <a href="{% url 'newsletter_update' item.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'newsletter_delete' item.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No newsletters found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
