<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="fashionPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7D245F"/>
      <stop offset="100%" stop-color="#D65A9B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- KAYA -->
  <g font-family="Poppins, sans-serif"
     font-weight="400"
     text-anchor="middle"
     filter="url(#softShadow)">
    <text x="770" y="500" font-size="325" letter-spacing="8" fill="#151515">
      KA<tspan fill="#F24F87">Y</tspan>A
    </text>
  </g>

  <!-- Divider -->
  <rect x="262" y="562" width="1042" height="14" rx="2" fill="url(#fashionPink)"/>

  <!-- FASHION -->
  <text x="783" y="710"
        font-family="Poppins, sans-serif"
        font-size="108"
        font-weight="400"
        letter-spacing="58"
        text-anchor="middle"
        fill="url(#fashionPink)">FASHION</text>
</svg>
